# Etiquettage Pro (version web autonome)
spring.application.name=etiquettage-pro
# le poste seulement : aucune autre machine ne peut se connecter
server.address=127.0.0.1
server.port=${ETIQUETTAGE_PORT:8095}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-stacktrace=never
server.error.include-message=never

# base : en mode embarque, l'adresse est posee au demarrage (BaseEmbarquee) ; en mode externe, par la configuration
spring.datasource.url=${ETIQUETTAGE_DB_URL:jdbc:mariadb://127.0.0.1:3306/bd_etiquette?createDatabaseIfNotExist=true}
spring.datasource.username=${ETIQUETTAGE_DB_USER:root}
spring.datasource.password=${ETIQUETTAGE_DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# fichiers importes (CSV, Excel)
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB

etiquettage.ouvrir-navigateur=${ETIQUETTAGE_NAVIGATEUR:true}
logging.level.root=WARN
logging.level.com.prestige=INFO
logging.level.org.springframework.boot.web.embedded=INFO
