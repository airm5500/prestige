# Prestige Veille : surveillance independante de Prestige
spring.application.name=prestige-veille
# consultable depuis les autres postes du reseau : mot de passe obligatoire, a changer a la premiere connexion
server.address=${VEILLE_ADRESSE:0.0.0.0}
server.port=${VEILLE_PORT:8099}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-stacktrace=never
server.error.include-message=never

# base propre a la veille (fichier H2 dans le dossier de donnees)
spring.datasource.url=jdbc:h2:file:${VEILLE_DONNEES:${user.home}/PrestigeVeille}/veille;AUTO_SERVER=FALSE
spring.datasource.username=veille
spring.datasource.password=
spring.flyway.locations=classpath:db/migration

logging.level.root=WARN
logging.level.com.prestige=INFO
logging.level.org.springframework.boot.web.embedded=INFO
