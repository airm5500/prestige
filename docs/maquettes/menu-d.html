<title>Menu Prestige D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Prestige : bleu nuit de l'en-tete, cyan des donnees, or de la selection */
  --nuit:#10264a; --nuit2:#173560; --trait-nuit:#2a4a76; --texte-nuit:#e7eef7; --doux-nuit:#9db2cb;
  --or:#f2b84b; --cyan:#0891b2; --cyan-doux:#e3f4f8;
  --fond:#eef2f7; --surface:#ffffff; --texte:#0f1d33; --texte2:#5b6b80; --trait:#dde4ee; --survol:#f2f6fa; --marque:#fde68a; --voile:rgba(10,20,40,.45);
  --f-titre:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --f-texte:"Figtree","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nuit:#0a1a33;--nuit2:#11284a;--trait-nuit:#234068;--texte-nuit:#e2e9f3;--doux-nuit:#8ea4bf;
  --fond:#0d1626;--surface:#142035;--texte:#e3eaf4;--texte2:#9aabc1;--trait:#24344d;--survol:#1a2a44;--cyan-doux:#11344a;--marque:#6b5313;--voile:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--nuit:#0a1a33;--nuit2:#11284a;--trait-nuit:#234068;--texte-nuit:#e2e9f3;--doux-nuit:#8ea4bf;
  --fond:#0d1626;--surface:#142035;--texte:#e3eaf4;--texte2:#9aabc1;--trait:#24344d;--survol:#1a2a44;--cyan-doux:#11344a;--marque:#6b5313;--voile:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{background:var(--fond);color:var(--texte);font-family:var(--f-texte);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.entete{height:56px;background:linear-gradient(90deg,var(--nuit),var(--nuit2));color:var(--texte-nuit);display:flex;align-items:center;gap:12px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));position:relative;z-index:30}
.logo{width:32px;height:32px;border-radius:9px;background:#2fb872;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 32px}
.marque{font-family:var(--f-titre);font-weight:700;letter-spacing:1.5px;font-size:18px;white-space:nowrap}
.pastille{border:1px solid var(--trait-nuit);background:rgba(255,255,255,.06);border-radius:16px;padding:5px 12px;font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.esp{flex:1}
.entete kbd{background:transparent;border-color:var(--trait-nuit);color:var(--doux-nuit)}
.cacher-etroit{}
@media (max-width:760px){.cacher-etroit{display:none}}
.burger{display:none;color:var(--texte-nuit)}
@media (max-width:760px){.burger{display:grid;place-items:center;width:36px;height:36px}}
svg.lucide{width:18px;height:18px;stroke-width:2}
/* zone de l'ecran ouvert */
.ecran{padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;min-width:0}
.fil{font-size:12.5px;color:var(--texte2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ecran h1{font-family:var(--f-titre);font-weight:700;font-size:26px;margin:4px 0 14px;text-wrap:balance}
.factice{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.factice div{background:var(--surface);border:1px solid var(--trait);border-radius:10px;height:90px}
.factice .large{grid-column:1/-1;height:220px}
.note{margin-top:14px;font-size:12.5px;color:var(--texte2);max-width:70ch;line-height:1.5}
/* palette Ctrl K */
.voile{position:fixed;inset:0;background:var(--voile);z-index:60}
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));background:var(--surface);color:var(--texte);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);z-index:61;overflow:hidden;border:1px solid var(--trait)}
.p-ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--trait)}
.p-ch input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--texte);outline:none;min-width:0}
.p-r{max-height:52vh;overflow:auto;padding:6px}
.p-g{font-size:10.5px;letter-spacing:1.2px;color:var(--texte2);margin:8px 10px 4px;font-weight:700;text-transform:uppercase}
.p-l{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;width:100%;text-align:left}
.p-l small{margin-left:auto;color:var(--texte2);font-size:12px;text-align:right}
.p-l.on{background:var(--cyan-doux)}
mark{background:var(--marque);color:inherit;border-radius:3px;padding:0 1px}
.p-bas{border-top:1px solid var(--trait);padding:8px 14px;font-size:11.5px;color:var(--texte2);display:flex;gap:14px;flex-wrap:wrap}
kbd{font-family:var(--f-texte);font-size:11px;border:1px solid var(--trait);border-radius:4px;padding:0 5px;background:var(--survol)}
.badge{font-size:10.5px;font-weight:700;background:#fde2e2;color:#a61b1b;border-radius:9px;padding:1px 7px;font-variant-numeric:tabular-nums}
.etoile{color:var(--texte2);opacity:.55;display:grid;place-items:center;width:24px;height:24px;border-radius:6px}
.etoile.on{color:var(--or);opacity:1}
.etoile svg{width:15px;height:15px}
.etoile.on svg{fill:currentColor}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--nuit);color:var(--texte-nuit);padding:9px 16px;border-radius:9px;font-size:13px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* D : fusion de A et C. Rail d'icones (A) + arbre filtrable toujours visible (C) ; menu replie : le rail ouvre le
   volet par usage (A). Deux choix a faire dans « Réglages de la maquette » : pli-repli et barre horizontale. */
.app{display:flex;height:calc(100% - 56px)}
.rail{width:60px;background:var(--nuit);display:flex;flex-direction:column;align-items:center;padding-block:10px;gap:3px;flex:0 0 60px;overflow:auto}
.rail button{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--doux-nuit);flex:0 0 42px;position:relative}
.rail button:hover{background:var(--nuit2);color:var(--texte-nuit)}
.rail button.ici::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--or)}
/* repere du module choisi : 1 tuile or pleine ; 2 bordure or (actuel) ; 3 contour or */
body.rp-1 .rail button.on{background:var(--or);color:var(--nuit)}
body.rp-1 .rail button.on.ici::after{background:var(--nuit)}
body.rp-2 .rail button.on{background:var(--nuit2);color:#fff;box-shadow:inset 3px 0 0 var(--or)}
body.rp-3 .rail button.on{background:rgba(242,184,75,.14);color:var(--or);box-shadow:inset 0 0 0 2px var(--or)}
.rail .sep{width:30px;height:1px;background:var(--trait-nuit);margin:6px 0;flex:0 0 1px}
.arbre{width:290px;flex:0 0 290px;background:var(--surface);border-right:1px solid var(--trait);display:flex;flex-direction:column;min-height:0}
body.replie .arbre{display:none}
.a-tete{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--trait)}
.a-tete .champ{flex:1;display:flex;align-items:center;gap:7px;border:1px solid var(--trait);border-radius:9px;padding:7px 10px;background:var(--fond);min-width:0}
.a-tete input{border:0;background:none;font:inherit;font-size:13.5px;color:var(--texte);outline:none;width:100%;min-width:0}
.corps-cadre{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.a-corps{overflow:auto;flex:1;padding-block:6px}
/* barre de defilement des menus (arbre, volet, rail) : 4 propositions */
body.mb-1 .a-corps,body.mb-1 .grille{scrollbar-width:thin;scrollbar-color:transparent transparent}
body.mb-1 .a-corps:hover,body.mb-1 .grille:hover{scrollbar-color:color-mix(in srgb,var(--texte2) 45%,transparent) transparent}
body.mb-1 .a-corps::-webkit-scrollbar,body.mb-1 .grille::-webkit-scrollbar{width:8px}
body.mb-1 .a-corps::-webkit-scrollbar-thumb,body.mb-1 .grille::-webkit-scrollbar-thumb{background:transparent;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
body.mb-1 .a-corps:hover::-webkit-scrollbar-thumb,body.mb-1 .grille:hover::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--texte2) 45%,transparent);background-clip:padding-box}
body.mb-1 .rail{scrollbar-width:none}body.mb-1 .rail::-webkit-scrollbar{display:none}
body.mb-2 .a-corps,body.mb-2 .grille{scrollbar-color:var(--or) transparent}
body.mb-2 .a-corps::-webkit-scrollbar,body.mb-2 .grille::-webkit-scrollbar,body.mb-2 .rail::-webkit-scrollbar{width:6px}
body.mb-2 .a-corps::-webkit-scrollbar-track,body.mb-2 .grille::-webkit-scrollbar-track{background:var(--survol)}
body.mb-2 .a-corps::-webkit-scrollbar-thumb,body.mb-2 .grille::-webkit-scrollbar-thumb,body.mb-2 .rail::-webkit-scrollbar-thumb{background:var(--or);border-radius:3px}
body.mb-2 .rail{scrollbar-width:thin;scrollbar-color:var(--or) transparent}
body.mb-3 .a-corps,body.mb-3 .grille,body.mb-3 .rail{scrollbar-width:none}
body.mb-3 .a-corps::-webkit-scrollbar,body.mb-3 .grille::-webkit-scrollbar,body.mb-3 .rail::-webkit-scrollbar{display:none}
.fondu{display:none;position:absolute;left:0;right:0;height:34px;pointer-events:none;z-index:2;opacity:0;transition:opacity .2s}
.fondu.h{top:0;background:linear-gradient(var(--surface),transparent)}
.fondu.b{bottom:0;background:linear-gradient(transparent,var(--surface))}
.plus-bas{display:none;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:3;background:var(--nuit2);color:#fff;border-radius:14px;padding:4px 12px;font-size:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);align-items:center;gap:5px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.plus-bas svg{width:14px;height:14px}
body.mb-3 .fondu{display:block}body.mb-3 .plus-bas{display:flex}
body.mb-3 .corps-cadre.peut-h .fondu.h,body.mb-3 .corps-cadre.peut-b .fondu.b{opacity:1}
body.mb-3 .corps-cadre.peut-b .plus-bas{opacity:1;pointer-events:auto}
body.mb-4 .a-corps,body.mb-4 .grille{scrollbar-color:var(--nuit2) var(--fond)}
body.mb-4 .a-corps::-webkit-scrollbar,body.mb-4 .grille::-webkit-scrollbar{width:14px}
body.mb-4 .a-corps::-webkit-scrollbar-track,body.mb-4 .grille::-webkit-scrollbar-track{background:var(--fond);border-left:1px solid var(--trait)}
body.mb-4 .a-corps::-webkit-scrollbar-thumb,body.mb-4 .grille::-webkit-scrollbar-thumb{background:var(--nuit2);border-radius:7px;border:3px solid var(--fond)}
body.mb-4 .a-corps::-webkit-scrollbar-thumb:hover,body.mb-4 .grille::-webkit-scrollbar-thumb:hover{background:var(--or)}
body.mb-4 .rail{scrollbar-width:thin;scrollbar-color:var(--trait-nuit) transparent}
body.mb-4 .rail::-webkit-scrollbar{width:6px}body.mb-4 .rail::-webkit-scrollbar-thumb{background:var(--trait-nuit);border-radius:3px}
.sect{font-size:10.5px;letter-spacing:1.3px;color:var(--texte2);margin:12px 14px 4px;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sect svg{width:13px;height:13px}
.mod{display:flex;align-items:center;gap:10px;padding:8px 12px;width:100%;text-align:left;font-weight:600;font-size:13.5px;transition:background .2s}
.mod .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 28px}
.mod .ic svg{width:15px;height:15px}
.mod .chev{margin-left:auto;color:var(--texte2);transition:transform .15s}
.mod.ouvert .chev{transform:rotate(90deg)}
.mod:hover{background:var(--survol)}
.mod.eclaire{background:var(--cyan-doux)}
.mod .n{font-size:11px;color:var(--texte2);font-weight:500;font-variant-numeric:tabular-nums}
.sous{padding:0 0 6px 0;overflow:hidden}
.sous h4{margin:6px 0 2px 52px;font-size:10.5px;letter-spacing:1px;color:var(--cyan);text-transform:uppercase}
.ent{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 52px;font-size:13.2px;width:100%;text-align:left;position:relative;cursor:pointer}
.lst-court .ent{padding-left:16px}
.ent:hover{background:var(--survol)}
.ent.actif{background:var(--cyan-doux);font-weight:600}
.ent.actif::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--or)}
.ent .etoile{margin-left:auto;opacity:0}.ent:hover .etoile,.ent .etoile.on{opacity:1}
.vide{padding:14px 16px;color:var(--texte2);font-size:13px;line-height:1.5}
.contenu{flex:1;position:relative;min-width:0;display:flex}
/* volet par usage (A), quand le menu est replie */
.volet{position:absolute;inset:0 auto 0 0;width:min(600px,100%);background:var(--surface);box-shadow:14px 0 34px rgba(10,20,40,.22);display:flex;flex-direction:column;z-index:20}
.v-tete{padding:14px 20px 10px;border-bottom:1px solid var(--trait);display:flex;align-items:center;gap:10px}
.v-tete h2{margin:0;font-family:var(--f-titre);font-size:22px;font-weight:700}
.v-tete .sousv{font-size:12px;color:var(--texte2)}
.v-tete .fermer{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--texte2)}
.grille{columns:2 240px;column-gap:26px;padding:12px 20px 20px;overflow:auto}
.grp{break-inside:avoid;margin-bottom:10px}
.grp h3{font-size:11px;letter-spacing:1.1px;color:var(--cyan);margin:8px 0 4px;text-transform:uppercase;font-weight:700}
.grille .ent{padding:6px 8px;border-radius:8px;font-size:13.5px}
.ecran{flex:1;padding-bottom:0}
.bulle{position:fixed;background:#0b1424;color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;pointer-events:none;z-index:40;white-space:nowrap}
@media (max-width:760px){.rail{display:none}.arbre{position:fixed;top:56px;bottom:0;left:0;z-index:25;transform:translateX(-100%);transition:transform .2s;box-shadow:10px 0 30px rgba(0,0,0,.25)}
 body.tiroir .arbre{transform:none;display:flex}.volet{position:fixed;top:56px;left:0;right:0;bottom:0;width:auto;z-index:26}}

/* ecran d'exemple : grille large (18 colonnes) pour juger la barre horizontale */
.tbl-titre{display:flex;align-items:center;gap:10px;margin:4px 0 8px;font-size:12.5px;color:var(--texte2)}
.tbl-cadre{position:relative;background:var(--surface);border:1px solid var(--trait);border-radius:10px}
.tbl-zone{overflow-x:auto;border-radius:10px}
table.dem{border-collapse:separate;border-spacing:0;font-size:13px;min-width:1900px;width:100%}
table.dem th{position:sticky;top:0;background:var(--survol);text-align:left;font-weight:600;color:var(--texte2);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--trait);white-space:nowrap}
table.dem td{padding:8px 12px;border-bottom:1px solid var(--trait);white-space:nowrap;font-variant-numeric:tabular-nums}
table.dem td.num,table.dem th.num{text-align:right}
table.dem tr:hover td{background:var(--survol)}
table.dem th:first-child,table.dem td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--trait)}
table.dem th:first-child{background:var(--survol);z-index:2}
.statut{font-size:11.5px;border-radius:10px;padding:2px 8px;background:var(--cyan-doux);color:var(--cyan);font-weight:600}
.fl,.ombre,.defil{display:none}

/* 1 : fine et discrete, s'epaissit au survol */
body.sb-1 .tbl-zone{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--cyan) 55%,transparent) transparent}
body.sb-1 .tbl-zone::-webkit-scrollbar{height:10px}
body.sb-1 .tbl-zone::-webkit-scrollbar-track{background:transparent}
body.sb-1 .tbl-zone::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--cyan) 45%,transparent);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
body.sb-1 .tbl-zone:hover::-webkit-scrollbar-thumb{border-width:1px;background:color-mix(in srgb,var(--cyan) 75%,transparent);background-clip:padding-box}

/* 2 : epaisse et contrastee, facile a attraper (ecran tactile, souris de caisse) */
body.sb-2 .tbl-zone{scrollbar-color:var(--nuit2) var(--fond)}
body.sb-2 .tbl-zone::-webkit-scrollbar{height:16px}
body.sb-2 .tbl-zone::-webkit-scrollbar-track{background:var(--fond);border-top:1px solid var(--trait);border-radius:0 0 10px 10px}
body.sb-2 .tbl-zone::-webkit-scrollbar-thumb{background:var(--nuit2);border-radius:8px;border:3px solid var(--fond)}
body.sb-2 .tbl-zone::-webkit-scrollbar-thumb:hover{background:var(--or)}

/* 3 et 4 : barre native cachee */
body.sb-3 .tbl-zone,body.sb-4 .tbl-zone{scrollbar-width:none}
body.sb-3 .tbl-zone::-webkit-scrollbar,body.sb-4 .tbl-zone::-webkit-scrollbar{display:none}

/* 3 : barre flottante collee au bas de l'ecran, avec fleches et position des colonnes */
body.sb-3 .defil{display:flex;position:sticky;bottom:0;z-index:5;align-items:center;gap:10px;margin:0 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--fond) 88%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--trait)}
.defil button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--trait);color:var(--texte);flex:0 0 32px}
.defil button:hover{border-color:var(--cyan);color:var(--cyan)}
.defil button:disabled{opacity:.35;cursor:default}
.piste{flex:1;height:10px;border-radius:6px;background:var(--trait);position:relative;cursor:pointer;min-width:60px}
.pouce{position:absolute;top:-3px;height:16px;border-radius:8px;background:var(--cyan);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pouce:active{cursor:grabbing}
.defil .pos{font-size:12px;color:var(--texte2);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:760px){.defil .pos{display:none}}

/* 4 : pas de barre ; ombres de bord + fleches rondes quand il reste des colonnes */
body.sb-4 .ombre{display:block;position:absolute;top:0;bottom:0;width:36px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}
body.sb-4 .ombre.g{left:var(--col1,0px);background:linear-gradient(90deg,rgba(10,20,40,.18),transparent)}
body.sb-4 .ombre.d{right:0;background:linear-gradient(270deg,rgba(10,20,40,.18),transparent);border-radius:0 10px 10px 0}
body.sb-4 .fl{display:grid;place-items:center;position:absolute;top:3px;width:30px;height:30px;border-radius:50%;background:var(--nuit2);color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:4;opacity:0;pointer-events:none;transition:opacity .2s}
body.sb-4 .fl.g{left:calc(var(--col1,0px) + 8px)}
body.sb-4 .fl.d{right:8px}
body.sb-4 .tbl-cadre.peut-g .ombre.g,body.sb-4 .tbl-cadre.peut-d .ombre.d{opacity:1}
body.sb-4 .tbl-cadre.peut-g .fl.g,body.sb-4 .tbl-cadre.peut-d .fl.d{opacity:1;pointer-events:auto}
.astuce{font-size:12px;color:var(--texte2);margin:8px 2px 18px}

/* reglages de la maquette (choix a faire) */
.reglages{background:var(--surface);border:1px solid var(--trait);border-left:4px solid var(--or);border-radius:12px;margin:0 0 16px;font-size:13px}
.reglages .r-tete{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;cursor:pointer;width:100%;text-align:left}
.reglages .r-tete .chev{margin-left:auto;transition:transform .15s}
.reglages.ferme .r-tete .chev{transform:rotate(180deg)}
.reglages.ferme .r-corps{display:none}
.r-corps{padding:0 14px 6px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:4px 18px;align-items:start}
.r-corps .r-g{min-width:0}
.seg.deux{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.r-q{font-weight:600;margin:10px 0 6px}
.seg{display:grid;gap:6px}

<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script>
function demarrer() {
/* Menu reel du banc (profil administrateur), regroupe par usage pour la maquette. Les 4 entrees masquees et les
   entrees absentes du menu ne figurent pas. */
const MODULES = [
 {id:'sc', nom:'Service client', ic:'shopping-cart', c:'#3b82f6', groupes:[

   ['Caisse', ['Ouverture de caisse','Fonds de caisse','Clôture de caisse','Retraits et abandons']],
   ['Suivi des ventes', ['Ventes terminées','Ventes annulées','Ventes dépôts','Liste des avoirs','Ordonnancier']],
   ['Clients', ['Suivi dossier client','Points fidélité','Rappels traitement','Analyse posologie','Modèles de messages']]]},
 {id:'gc', nom:'Gestion courante', ic:'briefcase', c:'#8b5cf6', groupes:[
   ['Caisse', ['Gestion caisse','Liste de caisse','Visualiser la caisse','Mouvements de caisse','Caisse / recette','Ticket Z']],
   ['Balances', ['Balance vente / caisse','Balance dépôt','Point caisse dépôt','Balance para']],
   ['Bons et articles', ['Liste des bons','Bons par organisme','Liste des articles vendus','Articles vendus récap','Mouchard prix de vente']]]},
 {id:'fa', nom:'Facturation', ic:'file-text', c:'#ec4899', groupes:[
   ['Facturer', ['Dossiers à facturer','Factures','Factures provisoires','Factures compagnies d\'assurance']],
   ['Encaisser', ['Liste des règlements','Gestion des différés','Suivi des bons','Récap par organisme']],
   ['Modèles', ['Modèle de facture','Modèles de facture']]]},
 {id:'tp', nom:'Tiers payants', ic:'handshake', c:'#06b6d4', groupes:[
   ['Organismes', ['Tiers-payants','Type tiers-payants','Groupe et compagnie d\'assurance','Taux de remboursement','Régimes caisse','Tiers payants désactivés']],
   ['Clients', ['Clients','Sociétés','Catégorie client','Clients désactivés','Cautions']],
   ['Encours', ['Balance âgée récap','Balance âgée détaillée','Dossiers tiers-payants','Gestion des litiges']],
   ['Carnets et dépôts', ['Gestion carnet dépôt','Dépôt carnet','Retour carnet dépôt','Balance carnet','Emplacements / dépôt','Gestion dépôts extensions']],
   ['Remises', ['Remises','Grille de remise','Gérer les TP à exclure','Tiers-payants exclus','Promotions','Historique des promotions']]]},
 {id:'co', nom:'Commandes', ic:'truck', c:'#f97316', groupes:[
   ['Préparer', ['Suggestion de réappro.','Prévisions','Proposition commande','Liste des ruptures','Péremptions courtes','Offres de prix']],
   ['Commander', ['Commande en cours','Transaction commande','Achats mensuels grossiste']],
   ['Recevoir', ['Gestion des entrées','Pointer BL et avoirs','Liste des lots','Unités gratuites','Retour fournisseur']],
   ['Contrôler', ['État de contrôle achats','État de contrôle annuel']]]},
 {id:'st', nom:'Stock', ic:'package', c:'#22c55e', groupes:[
   ['Produits', ['Produits','Fiche article','Gestion des doublons','Gamme produits','Laboratoire produits','Mise à jour produits','Liste articles désactivés','Gérer code gestion']],
   ['Mouvements', ['Suivi mouvement article','Suivi article complet','Entrées / sorties détail','Articles mouvementés','Retour dépôt','Ajustement du stock']],
   ['Inventaire', ['Travaux d\'inventaire','Annulés en inventaire','Comparaison stock article','Détails','État de stock']],
   ['Périmés', ['Gestion des périmés','Saisie des périmés','Recherche périmés','Périmés retirés du stock']],
   ['Rayons et réserves', ['Emplacement','Produits par code géo','Gestion des réserves','Optimisation quantité']],
   ['Valeur et ventes', ['Valorisation du stock','Set valorisation','Évolution stock','Évaluation des ventes','Ventes par produit','Articles invendus']],
   ['Étiquettes', ['Gestion étiquette','Étiquettage Pro']]]},
 {id:'pa', nom:'Paramétrages', ic:'sliders-horizontal', c:'#94a3b8', groupes:[
   ['Officine', ['Identification pharmacie','Paramétrage général','Menu personnel','Gestion des devises','Fournisseurs SMS','Mode de règlements','Motifs règlement']],
   ['Articles', ['Gérer famille','Groupe famille','Gérer forme article','Gérer état article','Gérer les DCI','Gérer contre-indication','Gérer fabricant','Gérer tranche']],
   ['Partenaires', ['Gérer grossistes','Groupe grossistes','Gérer médecin','Gérer spécialité médecin','Gérer centre payeur','Gérer fiche société','Gérer type société','Gérer escompte société','Gérer ville']],
   ['Remises et risques', ['Gérer type remise','Gérer workflow remise','Gérer risques','Gérer type risque','Gérer ayant droit','Catégories ayants droit','Gérer motif retour']]]},
 {id:'re', nom:'Rétrocession', ic:'arrow-left-right', c:'#14b8a6', groupes:[
   ['Rétrocession', ['Rétrocession','Gestion des confrères']]]},
 {id:'ag', nom:'Analyse de gestion', ic:'line-chart', c:'#eab308', groupes:[
   ['Pilotage', ['Pilotage de l\'officine','Tableau de bord','Tableau de bord carnet','Rapport activité','Récapitulatif activité','Compte d\'exploitation']],
   ['Ventes', ['Statistiques des ventes','Statistique annuelle CA','Chiffre d\'affaires 20/80','Classification ABC','Unités vendues','Marge sur produits','Statistique sur TVA','Suivi remise']],
   ['Familles et produits', ['Statistique famille','Comparaison CA familles','Vente / stock famille','Stats produits / gamme','Stats produits / labo','Analyse article','CA emplacement / famille','CA par emplacement']],
   ['Achats', ['Statistique des achats','Achats annuels','Achats fournisseurs','Achats mensuels produits','CA par grossiste','Ruptures de stock']],
   ['Clients et équipe', ['Ventes mensuelles client','Ventes mensuelles société','Analyse tiers payants','Rétrocessions','Fréquentation officine','Activité opérateurs','Activité des équipes','Gestion des gardes','Feuille de match']]]},
 {id:'no', nom:'Notifications', ic:'bell', c:'#ef4444', groupes:[
   ['Notifications', ['Menu notifications','Modèle notification','Catégorie notification','Gestion des SMS','Envoi de SMS récap']]]},
 {id:'ut', nom:'Utilisateurs', ic:'users', c:'#6366f1', groupes:[
   ['Comptes', ['Utilisateurs','Gestion de profils','Privilèges','Langues','Mon compte']]]},
 {id:'cw', nom:'Campagnes SMS / WhatsApp', ic:'messages-square', c:'#22c55e', groupes:[
   ['Campagnes', ['Campagnes','Comptes WhatsApp']]]},
 {id:'rh', nom:'Ressources humaines', ic:'contact', c:'#0ea5e9', groupes:[
   ['Équipe', ['Ressources humaines']]]},
 {id:'av', nom:'Avis clients', ic:'star', c:'#f59e0b', groupes:[
   ['Avis', ['Avis clients']]]},
 {id:'su', nom:'Centre de support', ic:'headphones', c:'#64748b', groupes:[
   ['Aide', ['Me contacter','Tickets support']],
   ['Surveillance', ['Diagnostic & bugs','Santé application','Stabilité du serveur','Historique','Maintenance','Audit & rapprochements']]]}
];
/* compteurs a traiter (exemple) */
const BADGES = {'Rappels traitement':12, 'Liste des avoirs':3, 'Pointer BL et avoirs':5, 'Suggestion de réappro.':28, 'Tickets support':2};
const ENTREES = [];
MODULES.forEach(m => m.groupes.forEach(([g, l]) => l.forEach(e => ENTREES.push({e, g, m}))));
const sansAccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const store = {
  lire(k, d) { try { const v = localStorage.getItem('maq-nav-' + k); return v ? JSON.parse(v) : d; } catch (x) { return d; } },
  ecrire(k, v) { try { localStorage.setItem('maq-nav-' + k, JSON.stringify(v)); } catch (x) { /* navigation privee */ } }
};
let FAVORIS = store.lire('fav', ['Ventes', 'Pointer BL et avoirs', 'Pilotage de l\'officine', 'Travaux d\'inventaire']);
let RECENTS = store.lire('rec', ['Activité des équipes', 'Clôture de caisse', 'Gestion des entrées']);
const estFavori = e => FAVORIS.includes(e);
function basculerFavori(e) { FAVORIS = estFavori(e) ? FAVORIS.filter(x => x !== e) : FAVORIS.concat(e); store.ecrire('fav', FAVORIS); }
function noterRecent(e) { RECENTS = [e].concat(RECENTS.filter(x => x !== e)).slice(0, 5); store.ecrire('rec', RECENTS); }
function chercher(q) {
  const t = sansAccent(q.trim()); if (!t) return [];
  return ENTREES.map(x => ({x, i: sansAccent(x.e).indexOf(t), mots: sansAccent(x.e + ' ' + x.g + ' ' + x.m.nom).split(/\s+/).some(w => w.startsWith(t))}))
    .filter(r => r.i >= 0 || r.mots).sort((a, b) => (a.i < 0) - (b.i < 0) || a.i - b.i || a.x.e.length - b.x.e.length).slice(0, 8).map(r => r.x);
}
function surligner(e, q) {
  const t = sansAccent(q.trim()), i = sansAccent(e).indexOf(t);
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return i < 0 || !t ? esc(e) : esc(e.slice(0, i)) + '<mark>' + esc(e.slice(i, i + t.length)) + '</mark>' + esc(e.slice(i + t.length));
}
const trouver = e => ENTREES.find(x => x.e === e);

/* commun aux trois maquettes : en-tete, ecran ouvert, palette Ctrl K, favoris, toast */
const $ = (s, r) => (r || document).querySelector(s);
const ico = (n, cls) => '<i data-lucide="' + n + '"' + (cls ? ' class="' + cls + '"' : '') + '></i>';
const rafraichirIcones = () => { if (window.lucide) lucide.createIcons(); };
let ECRAN = 'Ventes';
function enteteHtml(variante) {
  return '<header class="entete"><button class="burger" id="burger" aria-label="Menu">' + ico('menu') + '</button><span class="logo">+</span>'
    + '<span class="marque">PRESTIGE 3</span><span class="pastille cacher-etroit">' + ico('clock') + ' sam. 24 oct. 2026 09:42</span><span class="esp"></span>'
    + (variante === 'barre' ? '' : '<span class="pastille cacher-etroit">' + ico('building-2') + ' PHIE DE GBOGUHE SARL-U</span><span class="esp"></span>')
    + '<button class="pastille" id="ouvrir-palette" title="Rechercher un écran (Ctrl K)">' + ico('search') + '<span class="cacher-etroit">Rechercher</span> <kbd class="cacher-etroit">Ctrl K</kbd></button>'
    + '<span class="pastille cacher-etroit">' + ico('user') + ' Super Admin</span></header>';
}
function ouvrir(e) {
  const x = trouver(e); if (!x) return;
  ECRAN = e; noterRecent(e);
  $('#ecran').innerHTML = '<div class="fil">' + ico(x.m.ic) + x.m.nom + ' › ' + x.g + '</div><h1>' + e + '</h1>'
    + '<div class="factice"><div></div><div></div><div></div><div class="large"></div></div>'
    + '<p class="note">Maquette : l\'écran « ' + e + ' » s\'ouvrirait ici. La recherche, les favoris (★) et les récents fonctionnent ; ils sont gardés dans ce navigateur seulement.</p>';
  rafraichirIcones();
  if (window.apresOuverture) apresOuverture(e);
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function etoile(e) { return '<button class="etoile' + (estFavori(e) ? ' on' : '') + '" data-fav="' + e.replace(/"/g, '&quot;') + '" title="' + (estFavori(e) ? 'Retirer des favoris' : 'Ajouter aux favoris') + '">' + ico('star') + '</button>'; }
document.addEventListener('click', (ev) => {
  const f = ev.target.closest('[data-fav]');
  if (f) { ev.stopPropagation(); const e = f.getAttribute('data-fav'); basculerFavori(e); toast(estFavori(e) ? '« ' + e + ' » ajouté aux favoris' : '« ' + e + ' » retiré des favoris'); if (window.redessiner) redessiner(); return; }
  const o = ev.target.closest('[data-ouvrir]');
  if (o) { ouvrir(o.getAttribute('data-ouvrir')); fermerPalette(); }
}, true);
/* palette */
let pSel = 0, pRes = [];
function ouvrirPalette() {
  if ($('.palette')) return;
  document.body.insertAdjacentHTML('beforeend', '<div class="voile" id="voile"></div><div class="palette" role="dialog" aria-label="Rechercher un écran"><div class="p-ch">' + ico('search')
    + '<input id="p-saisie" placeholder="Écran, module ou usage… ex. clôt, périmés, BL" autocomplete="off"></div><div class="p-r" id="p-r"></div>'
    + '<div class="p-bas"><span><kbd>↑</kbd> <kbd>↓</kbd> choisir</span><span><kbd>Entrée</kbd> ouvrir</span><span><kbd>Échap</kbd> fermer</span><span style="margin-left:auto">Seuls vos menus autorisés apparaissent</span></div></div>');
  $('#voile').onclick = fermerPalette;
  const s = $('#p-saisie'); s.oninput = () => { pSel = 0; dessinerPalette(); }; s.focus(); dessinerPalette();
}
function fermerPalette() { ['.palette', '#voile'].forEach(x => { const e = $(x); if (e) e.remove(); }); }
function dessinerPalette() {
  const q = $('#p-saisie').value; let h = '';
  if (q.trim()) { pRes = chercher(q); h = '<div class="p-g">Écrans</div>' + (pRes.length ? pRes.map((x, i) => '<button class="p-l' + (i === pSel ? ' on' : '') + '" data-ouvrir="' + x.e.replace(/"/g, '&quot;') + '">' + ico(x.m.ic) + '<span>' + surligner(x.e, q) + '</span><small>' + x.m.nom + ' › ' + x.g + '</small></button>').join('') : '<div class="p-l">Aucun écran ne correspond. Essayez un autre mot (ex. « caisse », « BL »).</div>'); }
  else { pRes = RECENTS.map(trouver).filter(Boolean); h = '<div class="p-g">Récents</div>' + pRes.map((x, i) => '<button class="p-l' + (i === pSel ? ' on' : '') + '" data-ouvrir="' + x.e.replace(/"/g, '&quot;') + '">' + ico('history') + '<span>' + x.e + '</span><small>' + x.m.nom + '</small></button>').join(''); }
  $('#p-r').innerHTML = h; rafraichirIcones();
}
document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); ouvrirPalette(); return; }
  if (!$('.palette')) return;
  if (ev.key === 'Escape') fermerPalette();
  else if (ev.key === 'ArrowDown') { pSel = Math.min(pRes.length - 1, pSel + 1); dessinerPalette(); ev.preventDefault(); }
  else if (ev.key === 'ArrowUp') { pSel = Math.max(0, pSel - 1); dessinerPalette(); ev.preventDefault(); }
  else if (ev.key === 'Enter' && pRes[pSel]) { ouvrir(pRes[pSel].e); fermerPalette(); }
});


/* ---- D : fusion A + C ---- */
let OUVERTS = store.lire('d-ouverts', ['sc']), FILTRE = '', MODV = null;
let ACCORDEON = store.lire('d-accordeon', true), SB = store.lire('d-sb', 3), REG_FERME = store.lire('d-reg-ferme', false);
let RP = store.lire('d-rp', 1), MB = store.lire('d-mb', 1);
document.body.classList.add('rp-' + RP, 'mb-' + MB);
if (ACCORDEON && OUVERTS.length > 1) OUVERTS = OUVERTS.slice(-1);
document.body.classList.add('sb-' + SB);
document.body.insertAdjacentHTML('afterbegin', enteteHtml('d') + '<div class="app"><nav class="rail" id="rail"></nav>'
  + '<aside class="arbre"><div class="a-tete"><label class="champ">' + ico('search') + '<input id="filtre" placeholder="Filtrer le menu… (ex. périmés, BL)" autocomplete="off"></label></div>'
  + '<div class="corps-cadre" id="corps-cadre"><div class="fondu h"></div><div class="a-corps" id="corps"></div><div class="fondu b"></div>'
  + '<button class="plus-bas" data-act="plus-bas">' + ico('chevrons-down') + ' Plus bas</button></div></aside>'
  + '<div class="contenu"><div id="volet-place"></div><main class="ecran" id="ecran"></main></div></div>'
  );

const echap = s => s.replace(/"/g, '&quot;');
const ligne = (e) => '<div class="ent' + (e === ECRAN ? ' actif' : '') + '" role="button" tabindex="0" data-ouvrir="' + echap(e) + '">' + surligner(e, FILTRE)
  + (BADGES[e] ? ' <span class="badge">' + BADGES[e] + '</span>' : '') + etoile(e) + '</div>';
const replie = () => document.body.classList.contains('replie');

function dessinerRail() {
  const modActif = (trouver(ECRAN) || {}).m;
  $('#rail').innerHTML = '<button data-act="palette" data-bulle="Rechercher (Ctrl K)">' + ico('search') + '</button>'
    + '<button data-act="replier" data-bulle="' + (replie() ? 'Déplier le menu' : 'Replier le menu') + '">' + ico(replie() ? 'panel-left-open' : 'panel-left-close') + '</button><span class="sep"></span>'
    + MODULES.map(m => { const on = replie() ? (MODV && MODV.id === m.id) : OUVERTS.includes(m.id);
      return '<button data-rail="' + m.id + '" class="' + (on ? 'on' : '') + (modActif === m ? ' ici' : '') + '" data-bulle="' + echap(m.nom) + (modActif === m ? ' · écran ouvert (point or)' : '') + '">' + ico(m.ic) + '</button>'; }).join('');
}
function dessinerArbre() {
  const t = sansAccent(FILTRE); let h = '';
  if (!t) {
    h += '<div class="lst-court"><div class="sect">' + ico('star') + ' Favoris</div>' + (FAVORIS.length ? FAVORIS.map(ligne).join('') : '<div class="vide">Survolez un écran et cliquez ★ pour l\'épingler ici.</div>')
      + '<div class="sect">' + ico('history') + ' Récents</div>' + RECENTS.slice(0, 4).map(ligne).join('') + '</div>'
      + '<div class="sect">' + ico('layout-grid') + ' Modules <span style="margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500">' + (ACCORDEON ? 'un seul ouvert' : 'plusieurs ouverts') + '</span></div>';
  }
  let trouves = 0;
  MODULES.forEach(m => {
    const gs = m.groupes.map(([g, l]) => [g, l.filter(e => !t || sansAccent(e).includes(t) || sansAccent(g).includes(t))]).filter(g => g[1].length);
    if (t && !gs.length) return;
    const n = gs.reduce((s, g) => s + g[1].length, 0); trouves += n;
    const ouvert = t ? true : OUVERTS.includes(m.id);
    h += '<button class="mod' + (ouvert ? ' ouvert' : '') + '" data-mod="' + m.id + '" id="mod-' + m.id + '"><span class="ic" style="background:' + m.c + '26;color:' + m.c + '">' + ico(m.ic) + '</span><span class="lib">' + m.nom + '</span> <span class="n">' + n + '</span><span class="chev">' + ico('chevron-right') + '</span></button>';
    if (ouvert) h += '<div class="sous">' + gs.map(([g, l]) => '<h4>' + g + '</h4>' + l.map(ligne).join('')).join('') + '</div>';
  });
  if (t && !trouves) h += '<div class="vide">Aucun écran ne contient « ' + FILTRE.replace(/[<>&]/g, '') + ' ». Essayez un mot plus court, ou <kbd>Ctrl K</kbd>.</div>';
  $('#corps').innerHTML = h;
}
function dessinerVolet() {
  if (!MODV || !replie()) { $('#volet-place').innerHTML = ''; return; }
  const n = MODV.groupes.reduce((s, g) => s + g[1].length, 0);
  $('#volet-place').innerHTML = '<section class="volet" aria-label="' + MODV.nom + '"><div class="v-tete"><div><h2>' + MODV.nom + '</h2><div class="sousv">' + n + ' écrans · regroupés par usage</div></div>'
    + '<button class="fermer" data-act="fermer" title="Fermer">' + ico('x') + '</button></div><div class="grille">'
    + MODV.groupes.map(([g, l]) => '<div class="grp"><h3>' + g + '</h3>' + l.map(ligne).join('') + '</div>').join('') + '</div></section>';
}
const CHOIX_RP = [
  [1, 'Tuile or pleine', 'Toute l\'icône du module choisi est sur fond or.'],
  [2, 'Bordure or', 'Trait or à gauche de l\'icône (version actuelle).'],
  [3, 'Contour or', 'Un cadre or autour de l\'icône, fond léger.']];
const CHOIX_MB = [
  [1, 'Invisible au repos', 'Fine, elle n\'apparaît qu\'au survol du menu.'],
  [2, 'Fil or', 'Mince trait or, toujours visible, discret.'],
  [3, 'Fondus et « Plus bas »', 'Pas de barre : un fondu en haut et en bas, et un bouton « Plus bas » quand il reste des écrans.'],
  [4, 'Épaisse et contrastée', 'Large, facile à attraper ; devient or au survol.']];
const CHOIX_SB = [
  [1, 'Fine et discrète', 'Barre mince aux couleurs de Prestige, plus visible au survol.'],
  [2, 'Épaisse et contrastée', 'Facile à attraper à la souris ou au doigt ; devient or au survol.'],
  [3, 'Flottante en bas de l\'écran', 'Toujours visible même sur une longue liste, flèches ◀ ▶ et « colonnes 4–11 sur 18 ».'],
  [4, 'Flèches et ombres', 'Pas de barre : une ombre et une flèche ronde apparaissent du côté où il reste des colonnes.']];
function dessinerReglages() {
  if (!$('#reglages')) $('#ecran').insertAdjacentHTML('afterbegin', '<aside class="reglages' + (REG_FERME ? ' ferme' : '') + '" id="reglages"></aside>');
  $('#reglages').innerHTML = '<button class="r-tete" data-act="reglages">' + ico('sliders-horizontal') + ' Réglages de la maquette — à choisir<span class="chev">' + ico('chevron-down') + '</span></button>'
    + '<div class="r-corps"><div class="r-g"><div class="r-q">1. Pli-repli des modules</div><div class="seg">'
    + '<button data-acc="1" class="' + (ACCORDEON ? 'on' : '') + '"><span class="num">A</span><span><b>Un seul module ouvert</b><small>Déplier un module replie celui qui était ouvert.</small></span></button>'
    + '<button data-acc="0" class="' + (!ACCORDEON ? 'on' : '') + '"><span class="num">B</span><span><b>Plusieurs modules ouverts</b><small>Chaque module reste ouvert jusqu\'à ce qu\'on le referme.</small></span></button></div></div>'
    + '<div class="r-g"><div class="r-q">2. Barre de défilement horizontale</div><div class="seg deux">'
    + CHOIX_SB.map(([n, t, d]) => '<button data-sb="' + n + '" class="' + (SB === n ? 'on' : '') + '"><span class="num">' + n + '</span><span><b>' + t + '</b><small>' + d + '</small></span></button>').join('')
    + '</div></div>'
    + '<div class="r-g"><div class="r-q">3. Repère du module choisi dans le rail</div><div class="seg">'
    + CHOIX_RP.map(([n, t, d]) => '<button data-rp="' + n + '" class="' + (RP === n ? 'on' : '') + '"><span class="num">' + n + '</span><span><b>' + t + '</b><small>' + d + '</small></span></button>').join('') + '</div></div>'
    + '<div class="r-g"><div class="r-q">4. Barre de défilement des menus (arbre, volet, rail)</div><div class="seg deux">'
    + CHOIX_MB.map(([n, t, d]) => '<button data-mb="' + n + '" class="' + (MB === n ? 'on' : '') + '"><span class="num">' + n + '</span><span><b>' + t + '</b><small>' + d + '</small></span></button>').join('') + '</div></div>'
    + '</div><div class="ruban-d">Proposition D · fusion de A (rail, volet) et C (arbre filtrable)</div>';
}
function majFondus() {
  const c = $('#corps'), k = $('#corps-cadre'); if (!c) return;
  k.classList.toggle('peut-h', c.scrollTop > 4); k.classList.toggle('peut-b', c.scrollTop < c.scrollHeight - c.clientHeight - 4);
}
function redessiner() { dessinerRail(); dessinerArbre(); dessinerVolet(); dessinerReglages(); rafraichirIcones(); majFondus(); }

/* ---- ecran d'exemple : grille large ---- */
const COLS = [['Date', ''], ['Heure', ''], ['N° ticket', ''], ['Client', ''], ['Tiers payant', ''], ['Taux', 'num'], ['Montant brut', 'num'], ['Remise', 'num'], ['Net', 'num'],
  ['Part TP', 'num'], ['Part client', 'num'], ['Règlement', ''], ['Caissier', ''], ['Vendeur', ''], ['Poste', ''], ['Lignes', 'num'], ['Différé', ''], ['Statut', '']];
const f = n => n.toLocaleString('fr-FR').replace(/ /g, ' ');
function grilleHtml() {
  const tp = ['—', 'MUGEF-CI', 'ASCOMA', 'SAHAM', 'IPS-CNPS', 'ALLIANZ'], rg = ['Espèces', 'Mobile money', 'Carte', 'Chèque'], eq = ['Caisse 1', 'Caisse 2', 'Comptoir 3'];
  let corps = '';
  for (let i = 0; i < 24; i++) {
    const brut = 3500 + ((i * 7919) % 46000), taux = i % 3 === 0 ? 0 : [70, 80, 100][i % 3], rem = i % 5 === 0 ? Math.round(brut * .05) : 0, net = brut - rem, ptp = Math.round(net * taux / 100);
    const c = ['24/10/2026', (8 + Math.floor(i / 3)) + ':' + String((i * 17) % 60).padStart(2, '0'), 'T' + (241000 + i * 13), 'Client n° ' + (400 + i * 7), taux ? tp[1 + i % 5] : '—', taux ? taux + ' %' : '—',
      f(brut), rem ? f(rem) : '—', f(net), ptp ? f(ptp) : '—', f(net - ptp), rg[i % 4], 'Opérateur ' + (1 + i % 4), 'Vendeur ' + (1 + i % 5), eq[i % 3], String(1 + i % 6), i % 7 === 0 ? 'Oui' : 'Non', '<span class="statut">Clôturée</span>'];
    corps += '<tr>' + c.map((v, k) => '<td class="' + COLS[k][1] + '">' + v + '</td>').join('') + '</tr>';
  }
  return '<div class="tbl-titre">' + ico('table-2') + ' Exemple de grille large (18 colonnes) pour juger la barre horizontale · la 1re colonne reste fixe</div>'
    + '<div class="tbl-cadre" id="cadre"><div class="tbl-zone" id="zone"><table class="dem"><thead><tr>' + COLS.map(c => '<th class="' + c[1] + '">' + c[0] + '</th>').join('') + '</tr></thead><tbody>' + corps + '</tbody></table></div>'
    + '<div class="ombre g"></div><div class="ombre d"></div><button class="fl g" data-defil="-1" aria-label="Colonnes précédentes">' + ico('chevron-left') + '</button><button class="fl d" data-defil="1" aria-label="Colonnes suivantes">' + ico('chevron-right') + '</button></div>'
    + '<div class="defil" id="defil"><button data-defil="-1" aria-label="Colonnes précédentes">' + ico('chevron-left') + '</button><div class="piste" id="piste"><div class="pouce" id="pouce"></div></div>'
    + '<button data-defil="1" aria-label="Colonnes suivantes">' + ico('chevron-right') + '</button><span class="pos" id="pos"></span></div>'
    + '<p class="astuce">Partout : Maj + molette fait défiler les colonnes ; la flèche ◀ ▶ avance d\'un écran de colonnes.</p>';
}
function majDefil() {
  const z = $('#zone'); if (!z) return;
  const max = z.scrollWidth - z.clientWidth, x = z.scrollLeft, cadre = $('#cadre');
  const col1 = z.querySelector('th').offsetWidth; cadre.style.setProperty('--col1', col1 + 'px');
  cadre.classList.toggle('peut-g', x > 2); cadre.classList.toggle('peut-d', x < max - 2);
  const piste = $('#piste'), pouce = $('#pouce'), l = piste.clientWidth, w = Math.max(40, l * z.clientWidth / z.scrollWidth);
  pouce.style.width = w + 'px'; pouce.style.left = (max > 0 ? (l - w) * x / max : 0) + 'px';
  const ths = Array.from(z.querySelectorAll('th')); let a = 0, b = 0;
  ths.forEach((th, i) => { if (i === 0) return; const g = th.offsetLeft - x, d = g + th.offsetWidth; if (d > col1 + 4 && g < z.clientWidth - 4) { a = a || i + 1; b = i + 1; } });
  $('#pos').textContent = 'Colonnes ' + a + '–' + b + ' sur ' + ths.length;
  $('#defil').querySelectorAll('button')[0].disabled = x <= 2; $('#defil').querySelectorAll('button')[1].disabled = x >= max - 2;
}
function brancherGrille() {
  const z = $('#zone'); if (!z) return;
  z.addEventListener('scroll', majDefil, {passive: true});
  const piste = $('#piste'), pouce = $('#pouce');
  let depart = null;
  pouce.addEventListener('pointerdown', (ev) => { depart = {x: ev.clientX, s: z.scrollLeft}; pouce.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  pouce.addEventListener('pointermove', (ev) => { if (!depart) return; const l = piste.clientWidth - pouce.offsetWidth, max = z.scrollWidth - z.clientWidth; z.scrollLeft = depart.s + (ev.clientX - depart.x) * max / Math.max(1, l); });
  pouce.addEventListener('pointerup', () => { depart = null; });
  piste.addEventListener('pointerdown', (ev) => { if (ev.target !== piste) return; const r = piste.getBoundingClientRect(); z.scrollTo({left: (ev.clientX - r.left) / r.width * (z.scrollWidth - z.clientWidth), behavior: 'smooth'}); });
  majDefil();
}
window.addEventListener('resize', majDefil);

function apresOuverture(e) {
  const x = trouver(e);
  if (x) { if (ACCORDEON) OUVERTS = [x.m.id]; else if (!OUVERTS.includes(x.m.id)) OUVERTS.push(x.m.id); store.ecrire('d-ouverts', OUVERTS); }
  MODV = null; document.body.classList.remove('tiroir');
  const fac = $('#ecran .factice'); if (fac) fac.outerHTML = grilleHtml();
  const note = $('#ecran .note'); if (note) note.remove();
  redessiner(); brancherGrille();
  const a = $('#corps .ent.actif:not(.lst-court .ent)'); if (a) a.scrollIntoView({block: 'nearest'});
}
function basculerModule(id) {
  if (ACCORDEON) OUVERTS = OUVERTS.includes(id) ? [] : [id];
  else OUVERTS = OUVERTS.includes(id) ? OUVERTS.filter(x => x !== id) : OUVERTS.concat(id);
  store.ecrire('d-ouverts', OUVERTS);
}
$('#filtre').oninput = (ev) => { FILTRE = ev.target.value; dessinerArbre(); rafraichirIcones(); majFondus(); };
$('#corps').addEventListener('scroll', majFondus, {passive: true});
window.addEventListener('resize', majFondus);
$('#filtre').onkeydown = (ev) => { if (ev.key === 'Escape') { ev.target.value = ''; FILTRE = ''; dessinerArbre(); rafraichirIcones(); } if (ev.key === 'Enter') { const p = $('#corps .ent'); if (p) ouvrir(p.getAttribute('data-ouvrir')); } };
document.addEventListener('keydown', (ev) => {
  if (ev.key === '/' && !ev.target.matches('input')) { ev.preventDefault(); document.body.classList.remove('replie'); MODV = null; redessiner(); $('#filtre').focus(); }
  if (ev.key === 'Enter' && ev.target.matches('.ent')) ouvrir(ev.target.getAttribute('data-ouvrir'));
  if (ev.key === 'Escape' && MODV && !$('.palette')) { MODV = null; redessiner(); }
});
document.addEventListener('click', (ev) => {
  { const bu = $('.bulle'); if (bu) bu.remove(); }
  const m = ev.target.closest('[data-mod]'), r = ev.target.closest('[data-rail]'), a = ev.target.closest('[data-act]');
  const acc = ev.target.closest('[data-acc]'), sb = ev.target.closest('[data-sb]'), d = ev.target.closest('[data-defil]');
  if (m) { basculerModule(m.getAttribute('data-mod')); redessiner(); return; }
  if (r) { const x = MODULES.find(z => z.id === r.getAttribute('data-rail'));
    if (replie()) { MODV = MODV === x ? null : x; redessiner(); return; }
    /* menu deplie : le rail ouvre le module dans l'arbre et l'amene a l'oeil */
    if (!OUVERTS.includes(x.id)) basculerModule(x.id);
    FILTRE = ''; $('#filtre').value = ''; redessiner();
    const b = $('#mod-' + x.id); if (b) { b.scrollIntoView({block: 'start', behavior: 'smooth'}); b.classList.add('eclaire'); setTimeout(() => b.classList.remove('eclaire'), 900); }
    return; }
  if (acc) { ACCORDEON = acc.getAttribute('data-acc') === '1'; if (ACCORDEON && OUVERTS.length > 1) OUVERTS = [((trouver(ECRAN) || {}).m || {}).id || OUVERTS[0]]; store.ecrire('d-accordeon', ACCORDEON); store.ecrire('d-ouverts', OUVERTS); redessiner(); toast(ACCORDEON ? 'Un seul module ouvert à la fois' : 'Plusieurs modules peuvent rester ouverts'); return; }
  const rp = ev.target.closest('[data-rp]'), mb = ev.target.closest('[data-mb]');
  if (rp) { document.body.classList.remove('rp-' + RP); RP = Number(rp.getAttribute('data-rp')); document.body.classList.add('rp-' + RP); store.ecrire('d-rp', RP); dessinerReglages(); rafraichirIcones(); return; }
  if (mb) { document.body.classList.remove('mb-' + MB); MB = Number(mb.getAttribute('data-mb')); document.body.classList.add('mb-' + MB); store.ecrire('d-mb', MB); dessinerReglages(); rafraichirIcones(); majFondus(); return; }
  if (sb) { document.body.classList.remove('sb-' + SB); SB = Number(sb.getAttribute('data-sb')); document.body.classList.add('sb-' + SB); store.ecrire('d-sb', SB); dessinerReglages(); rafraichirIcones(); majDefil(); return; }
  if (d) { const z = $('#zone'); z.scrollBy({left: Number(d.getAttribute('data-defil')) * (z.clientWidth - 160), behavior: 'smooth'}); return; }
  if (a) { const act = a.getAttribute('data-act');
    if (act === 'palette') ouvrirPalette();
    if (act === 'fermer') { MODV = null; redessiner(); }
    if (act === 'replier') { document.body.classList.toggle('replie'); MODV = null; redessiner(); setTimeout(majDefil, 30); }
    if (act === 'plus-bas') { const c = $('#corps'); c.scrollBy({top: c.clientHeight * .7, behavior: 'smooth'}); }
    if (act === 'reglages') { REG_FERME = !REG_FERME; store.ecrire('d-reg-ferme', REG_FERME); $('#reglages').classList.toggle('ferme', REG_FERME); }
    return; }
  if (ev.target.closest('#burger')) { document.body.classList.toggle('tiroir'); return; }
  if (ev.target.closest('#ouvrir-palette')) { ouvrirPalette(); return; }
  if (MODV && !ev.target.closest('.volet') && !ev.target.closest('.rail') && !ev.target.closest('.palette') && !ev.target.closest('.toast') && !ev.target.closest('.reglages')) { MODV = null; redessiner(); }
});
/* bulles du rail */
document.addEventListener('mouseover', (ev) => { const b = ev.target.closest('[data-bulle]'); let t = $('.bulle'); if (!b) { if (t) t.remove(); return; }
  if (!t) { t = document.createElement('div'); t.className = 'bulle'; document.body.appendChild(t); } const q = b.getBoundingClientRect(); t.textContent = b.getAttribute('data-bulle'); t.style.left = (q.right + 8) + 'px'; t.style.top = (q.top + 10) + 'px'; });
window.redessiner = redessiner; window.apresOuverture = apresOuverture;
redessiner(); ouvrir('Ventes terminées');
}
if (document.body) demarrer(); else document.addEventListener("DOMContentLoaded", demarrer);
</script>
