# Extensions JasperReports de l'application.
#
# Declare la famille de polices utilisee par les etats (voir fonts/prestige-fonts.xml).
# Sans ce fichier, un etat qui demande « Arial » echoue avec JRFontNotFoundException sur toute
# machine ou Arial n'est pas installee — un serveur Linux, typiquement. Ce n'est pas une mise en
# page degradee : aucun PDF n'est produit du tout.
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.prestige=fonts/prestige-fonts.xml
